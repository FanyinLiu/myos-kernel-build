name: build-kernel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev \
            libelf-dev cpio rsync wget xz-utils git
          # The Huawei kernel requires the exact toolchain from its README
          # (aarch64-linux-android-4.9). Newer GCC trips on its 4.9-era APIs.
          git clone --depth 1 -b google \
            https://github.com/growtopiajaw/aarch64-linux-android-4.9 \
            "$HOME/tc"
          ls "$HOME/tc/bin" | head -5
          chmod +x "$HOME/tc/bin/"* 2>/dev/null || true
          "$HOME/tc/bin/aarch64-linux-android-gcc" --version | head -1

      - name: Fetch kernel source (mirrored release asset)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Huawei's own CDN is too slow from GitHub runners, so the tarball is
          # mirrored as a release asset in this repo (see release kernel-source-v1).
          gh release download kernel-source-v1 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'yale_pie_opensource.tar.gz' \
            --output src.tar.gz
          ls -lh src.tar.gz
          tar xzf src.tar.gz
          du -sh Code_Opensource

      - name: Apply MyOS patches
        run: |
          set -euo pipefail
          cd Code_Opensource
          for p in ../patches/*.patch; do
            echo "applying $p"
            patch -p1 -i "$p"
          done

      - name: Configure and build
        run: |
          set -euo pipefail
          cd Code_Opensource/kernel
          export ARCH=arm64
          export CROSS_COMPILE="$HOME/tc/bin/aarch64-linux-android-"
          export PATH="$HOME/tc/bin:$PATH"
          # host tools build with the distro GCC; kernel 4.9's dtc needs -fcommon
          HOSTFLAGS="-Wall -Wmissing-prototypes -Wstrict-prototypes -O2 -fomit-frame-pointer -std=gnu89 -fcommon"
          make O=../out merge_kirin980_defconfig
          # GCC 4.9 has no -fstack-protector-strong; the Huawei defconfig
          # requests it, so drop to the plain stack protector.
          ./scripts/config --file ../out/.config -d CC_STACKPROTECTOR_STRONG
          ./scripts/config --file ../out/.config -e CC_STACKPROTECTOR
          make O=../out olddefconfig
          make O=../out HOSTCFLAGS="$HOSTFLAGS" -j"$(nproc)" Image.gz

      - name: Collect artifacts
        run: |
          set -euo pipefail
          OUT=Code_Opensource/out/arch/arm64/boot
          ls -lh "$OUT"
          mkdir -p artifacts
          cp "$OUT/Image.gz" artifacts/
          # device trees: the base config + the YAL-AL00 overlay variants
          find Code_Opensource/out/arch/arm64/boot/dts -name '*.dtb' 2>/dev/null \
            -exec cp {} artifacts/ \; || true
          ls -lh artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: myos-kernel-yale
          path: artifacts/
          retention-days: 30
