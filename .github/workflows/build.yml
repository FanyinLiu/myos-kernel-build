name: build-kernel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    # Ubuntu 20.04 ships GCC 9.4 for aarch64 — close enough to the 4.9 the
    # Huawei README asks for, and unlike third-party toolchain mirrors it is a
    # complete, self-consistent install. node20 (actions/checkout) needs
    # glibc >= 2.28, so 20.04 is the oldest container that still works.
    container: ubuntu:20.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        shell: bash
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y build-essential bc bison flex libssl-dev libelf-dev \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            cpio rsync wget xz-utils git ca-certificates curl python-is-python3
          # Huawei's tree hardcodes the Android toolchain names in a few places
          # (e.g. tzdriver/Makefile calls aarch64-linux-android-cpp directly).
          # Alias them instead of patching every occurrence.
          ln -sf /usr/bin/aarch64-linux-gnu-cpp /usr/local/bin/aarch64-linux-android-cpp
          ln -sf /usr/bin/aarch64-linux-gnu-gcc /usr/local/bin/aarch64-linux-android-gcc
          ln -sf /usr/bin/aarch64-linux-gnu-ld /usr/local/bin/aarch64-linux-android-ld
          aarch64-linux-gnu-gcc --version | head -1

      - name: Fetch kernel source (mirrored release asset)
        shell: bash
        run: |
          set -euo pipefail
          # Huawei's own CDN is too slow from GitHub runners, so the tarball is
          # mirrored as a public release asset in this repo (release kernel-source-v1).
          curl -sSL --retry 3 --retry-delay 5 \
            -o src.tar.gz \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/kernel-source-v1/yale_pie_opensource.tar.gz"
          ls -lh src.tar.gz
          tar xzf src.tar.gz
          du -sh Code_Opensource

      - name: Apply MyOS patches
        shell: bash
        run: |
          set -euo pipefail
          cd Code_Opensource
          for p in ../patches/*.patch; do
            echo "applying $p"
            patch -p1 -i "$p"
          done

      - name: Relax Huawei's -Werror flags
        shell: bash
        run: |
          cd Code_Opensource/kernel
          # Several Huawei driver Makefiles append a bare `-Werror` to
          # EXTRA_CFLAGS, which lands after KBUILD_CFLAGS and turns every GCC 9
          # warning into a build failure. Demote only the bare form; leave
          # -Werror=<specific> and -Werror-<specific> alone so cc-option probes
          # keep working.
          set +e
          grep -rl -- '-Werror' --include=Makefile --include=Kbuild --include='*.mk' . 2>/dev/null > /tmp/wfiles.txt
          echo "files with -Werror: $(wc -l < /tmp/wfiles.txt)"
          xargs -r sed -i -E 's/-Werror([[:space:]]|$)/-Wno-error\1/g' < /tmp/wfiles.txt
          echo "sed exit: $?"
          grep -rn -- '-Werror[[:space:]]' --include=Makefile --include=Kbuild --include='*.mk' . 2>/dev/null | head -3
          echo "relax done"

      - name: Configure and build
        shell: bash
        run: |
          set -euo pipefail
          cd Code_Opensource/kernel
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          # kernel 4.9's dtc lexer/parser rely on -fcommon; GCC >=10 defaults to
          # -fno-common and the host build dies with "multiple definition of yylloc"
          HOSTFLAGS="-Wall -Wmissing-prototypes -Wstrict-prototypes -O2 -fomit-frame-pointer -std=gnu89 -fcommon"
          # GCC 9 still fires warnings Huawei's GCC 4.9 never emitted, and their
          # tree carries scattered -Werror; demote them but keep implicit
          # function declarations fatal (they truncate pointers at runtime).
          KFLAGS="-Wno-error -Werror=implicit-function-declaration"
          make O=../out merge_kirin980_defconfig
          # MyOS does not use the cellular baseband, and the modem link step
          # exceeds ARG_MAX in this container. Disable it.
          ./scripts/config --file ../out/.config -d HISI_BALONG_MODEM
          ./scripts/config --file ../out/.config -d HISI_BALONG_EXTRA_MODEM
          ./scripts/config --file ../out/.config -d HISI_BALONG_EXTRA_MODEM_MBB
          # keep the config self-consistent with this compiler
          make O=../out olddefconfig
          make O=../out HOSTCFLAGS="$HOSTFLAGS" KCFLAGS="$KFLAGS" -j"$(nproc)" Image.gz

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          OUT=Code_Opensource/out/arch/arm64/boot
          ls -lh "$OUT"
          mkdir -p artifacts
          cp "$OUT/Image.gz" artifacts/
          # device trees: the base config + the YAL-AL00 overlay variants
          find Code_Opensource/out/arch/arm64/boot/dts -name '*.dtb' 2>/dev/null \
            -exec cp {} artifacts/ \; || true
          ls -lh artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: myos-kernel-yale
          path: artifacts/
          retention-days: 30
